<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VMware Cloud Foundation 9.1.1 元件導覽</title>
<link rel="icon" href="data:,">
<meta name="description" content="以三維模型互動導覽 VMware Cloud Foundation 9.1.1 各元件：ESX、vCenter、vSAN、NSX、Supervisor／VKS、SDDC Manager、VCF Management Services、VCF Operations、VCF Automation 與 VCF Installer。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,monospace;
  --bg:#F3F3F1; --ink:#161616; --ink2:#55575A; --ink3:#8E9093;
  --rule:rgba(22,22,22,.16); --btn:rgba(255,255,255,.72); --card:rgba(255,255,255,.66);
  --ok:#2E9A8C; --bad:#C8553D; --focus:#4A7DC0;
  /* 縮放橫軸：模型放大時文字欄變窄（幅度上限約 20%） */
  --z:1; --pw:min(calc((60vw - 56px) * (2 - var(--z))), calc(100vw - 336px)); --mh:calc((100svh - 116px) * .4 * var(--z));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141516; --ink:#ECECE8; --ink2:#A9ABAD; --ink3:#76787B;
    --rule:rgba(236,236,232,.16); --btn:rgba(32,33,35,.72); --card:rgba(32,33,35,.66);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141516; --ink:#ECECE8; --ink2:#A9ABAD; --ink3:#76787B;
  --rule:rgba(236,236,232,.16); --btn:rgba(32,33,35,.72); --card:rgba(32,33,35,.66);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.mono{font-family:var(--mono)}

#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,var(--bg) 0,var(--bg) calc(var(--pw) - 60px),transparent calc(var(--pw) + 180px));opacity:.92;transition:background .4s}

/* 3D labels */
.lbl{pointer-events:none;white-space:nowrap;transition:opacity .2s}
.lbl .in{display:flex;align-items:baseline;gap:6px;transform:translateX(50%);font-size:13px;color:var(--ink);text-shadow:0 0 3px var(--bg),0 0 6px var(--bg),0 0 10px var(--bg)}
.lbl.left .in{transform:translateX(-50%);flex-direction:row-reverse}
.lbl.center .in{transform:none}
.lbl b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--c);letter-spacing:.02em}
.lbl i{font-style:normal;font-size:11.5px;color:var(--ink3)}
.lbl.title .in{transform:none;font-size:12px;letter-spacing:.12em;color:var(--ink2);padding:3px 8px;border:1px solid var(--rule);background:var(--btn);border-radius:99px}
.lbl.tag .in{transform:none;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:4px;background:var(--ink);color:var(--bg)}
/* 3D 區只佔 4 成，標籤只留產品名，中文說明看面板 */
.lbl i{display:none}
.lbl .in{font-size:12px}
/* 對照章只留兩個標題與 vSphere Foundation 方塊的標籤 */
body[data-mode="cmp"] .lbl.main{display:none}
/* 流程章只留目前步驟的標記，元件名看面板 */
body[data-mode="flow"] .lbl.main{display:none}

/* header */
#top{position:fixed;left:56px;right:40px;top:28px;height:44px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.06em;color:var(--ink2)}
.brand b{color:var(--ink);font-weight:500}
.brand .div{width:1px;height:22px;background:var(--rule)}
.ctl{display:flex;gap:8px}
.ctl button,#tools button,#bar button,.btn{border:1px solid var(--rule);background:var(--btn);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:99px;padding:7px 14px;font-size:13px;transition:background .2s,border-color .2s}
.ctl button:hover,#tools button:hover,#bar button:hover,.btn:hover{border-color:var(--ink3)}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

#tools{position:fixed;right:40px;top:84px;z-index:3;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3)}
.zl{display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--btn);border-radius:99px;padding:4px 10px;color:var(--ink2)}
.zl input{width:90px;accent-color:var(--ink)}

/* panel */
#panel{position:fixed;left:56px;top:100px;bottom:92px;width:var(--pw);z-index:2;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;overflow-anchor:none;scrollbar-width:none;padding-right:8px}
#panel::-webkit-scrollbar{display:none}
/* 所有章節連成一長頁，捲動決定目前章節；尾端留白讓最後一章也能捲到判斷線 */
#panel::after{content:"";display:block;height:55%}
.pg+.pg{margin-top:56px;padding-top:8px;border-top:1px solid var(--rule)}
.pg{transition:opacity .4s}
.pg:not(.on){opacity:.4}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink2);margin-top:28px}
.eyebrow .num{font-size:12px;color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:1px 6px}
.eyebrow .sep{flex:0 0 18px;height:1px;background:var(--rule)}
h1{font-size:50px;line-height:1.12;font-weight:500;letter-spacing:.01em;margin:22px 0 18px}
h1 small{display:block;font-size:22px;font-weight:300;color:var(--ink2);margin-top:10px;letter-spacing:.04em}
h2{font-size:32px;line-height:1.25;font-weight:500;letter-spacing:.02em;margin:18px 0 14px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
h2 em{font-style:normal;font-family:var(--mono);font-weight:300;font-size:15px;color:var(--ink3)}
h2 .badge{font-family:var(--mono);font-size:14px;font-weight:500;color:#fff;background:var(--c,var(--ink));border-radius:4px;padding:3px 8px;align-self:center}
h3{font-size:13px;font-weight:500;letter-spacing:.08em;color:var(--ink2);margin:24px 0 10px}
.lede{font-size:16px;line-height:1.85;color:var(--ink2);margin:0 0 20px;font-weight:300}
.lede b{color:var(--ink);font-weight:500}
.hint{font-size:13px;color:var(--ink3);line-height:1.7;margin-top:28px}
.foot{font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:26px;border-top:1px solid var(--rule);padding-top:12px}
.foot a{color:var(--ink2)}

.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px;border-top:1px solid var(--rule);padding-top:14px}
.figs.three{grid-template-columns:repeat(3,1fr);gap:0 16px}
.fig .n{font-family:var(--mono);font-size:30px;font-weight:300;line-height:1.1}
.fig .n small{font-family:var(--sans);font-size:14px;margin-left:3px;color:var(--ink2)}
.fig .k{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.5}
.fig .v{font-size:14px;line-height:1.5;margin-top:4px;color:var(--ink)}

ul.does{list-style:none;margin:0;padding:0}
ul.does li{position:relative;padding:8px 0 8px 22px;border-top:1px solid var(--rule);font-size:14.5px;line-height:1.65;color:var(--ink)}
ul.does li::before{content:"";position:absolute;left:2px;top:17px;width:8px;height:8px;border-radius:2px;background:var(--c)}
.ver{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:3px;border:1px solid var(--rule);color:var(--ink2);margin-right:6px;vertical-align:1px}
.ver.tp{border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--rule);background:var(--card)}
.analogy{margin-top:22px;padding:14px 16px;border-left:3px solid var(--c);background:var(--card);border-radius:0 6px 6px 0}
.analogy .k{font-size:12px;letter-spacing:.08em;color:var(--ink3)}
.analogy p{margin:6px 0 0;font-size:15px;line-height:1.75}

/* overview rows */
.stack{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 4px;transition:background .2s,padding .25s}
.row:hover,.row.hl{background:var(--card);padding-left:10px}
.row .L{font-family:var(--mono);font-size:12px;font-weight:500;color:#fff;background:var(--c);border-radius:4px;text-align:center;padding:2px 0}
.row .nm{font-size:15px}
.row .nm small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.row .scope{font-size:11.5px;color:var(--ink2);text-align:right}
.group-tag{font-size:11.5px;color:var(--ink3);letter-spacing:.08em;margin:14px 0 6px}
.hier{margin-top:18px;font-size:13.5px;line-height:1.8;color:var(--ink2)}
.hier b{font-family:var(--mono);font-weight:500;color:var(--ink)}

/* flow */
.fl-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.scrub{width:100%;accent-color:var(--ink)}
.scrub-k{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);font-family:var(--mono);margin-top:2px}
.fl-now{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.fl-now .ph{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:4px;background:var(--ink);color:var(--bg)}
.fl-now .sn{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.fl-now .tt{font-size:21px;font-weight:500;flex-basis:100%}
.fl-who{display:flex;flex-wrap:wrap;gap:6px}
.fl-note{font-size:15px;line-height:1.8;margin-top:14px;min-height:7.2em}
.fl-note b{font-weight:500}

/* compare */
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th{font-size:12px;font-weight:400;color:var(--ink3);text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--rule)}
.cmp td{padding:9px 6px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.5}
.cmp td small{display:block;color:var(--ink3);font-size:11.5px}
.cmp td.y{font-family:var(--mono);text-align:center;width:56px}
.cmp td.y.no{color:var(--ink3)}
.dot{display:inline-block;font-style:normal;font-family:var(--mono);font-size:11px;color:#fff;background:var(--c);border-radius:3px;padding:1px 5px}

/* quiz */
.qcard{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:16px 18px}
.qcard .qn{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.qcard p{font-size:17px;line-height:1.7;margin:8px 0 0}
.qbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.qbtns button{border:1px solid var(--rule);background:var(--btn);border-radius:6px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;transition:transform .15s,border-color .2s,background .2s}
.qbtns button b{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--c);white-space:nowrap}
.qbtns button span{font-size:11px;color:var(--ink2);white-space:nowrap}
.qbtns button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c)}
.qbtns button:disabled{cursor:default}
.qbtns button.right{background:var(--c);border-color:var(--c)}
.qbtns button.right b,.qbtns button.right span{color:#fff}
.qbtns button.wrong{border-color:var(--bad);border-style:dashed;opacity:.8}
.fb{min-height:6.2em;font-size:14.5px;line-height:1.75;margin-top:14px}
.fb .res{font-weight:500}
.fb .res.ok{color:var(--ok)} .fb .res.no{color:var(--bad)}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--ink2)}

/* bottom bar */
#bar{position:fixed;left:56px;right:40px;bottom:28px;height:40px;z-index:3;display:flex;align-items:center;gap:10px}
#bar #bPrev,#bar #bNext{width:40px;height:40px;padding:0;display:grid;place-items:center}
#ticks{display:flex;gap:4px;align-items:center}
#ticks button{border:0;background:none;padding:6px 3px;font-family:var(--mono);font-size:11px;color:var(--ink3);position:relative;border-radius:4px}
#ticks button::after{content:"";position:absolute;left:3px;right:3px;bottom:1px;height:2px;border-radius:2px;background:var(--rule);transition:background .3s}
#ticks button.on{color:var(--ink)}
#ticks button.on::after{background:var(--ink)}
#ticks button:hover{color:var(--ink)}
#curT{font-size:13px;color:var(--ink2);margin-left:6px;white-space:nowrap}
#progress{position:fixed;left:0;top:0;height:2px;background:var(--ink);z-index:4;width:0;transition:width .25s linear}

@media (max-width:820px){
  .veil{display:none}
  #top{left:16px;right:16px;top:10px}
  .brand span:not(.div){display:none}.brand .div{display:none}
  .ctl button{padding:6px 10px;font-size:12px}
  #stage{bottom:auto;height:var(--mh);top:52px}
  #tools{top:calc(52px + var(--mh) - 34px);right:16px}
  #tools span{display:none}
  .zl input{width:70px}
  #panel{left:16px;right:16px;width:auto;top:calc(52px + var(--mh));bottom:64px;padding-right:0;border-top:1px solid var(--rule)}
  .eyebrow{margin-top:16px}
  h1{font-size:34px;margin:14px 0}
  h1 small{font-size:17px}
  h2{font-size:25px}
  .fig .n{font-size:24px}
  #bar{left:16px;right:16px;bottom:12px}
  #ticks{overflow-x:auto;scrollbar-width:none;flex:1}
  #curT{display:none}
}
@media (prefers-reduced-motion:reduce){
  .pg{transition:none}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="progress"></div>
<div id="stage"></div>
<div class="veil"></div>

<header id="top">
  <div class="brand"><b>VCF 9.1.1</b><span class="div"></span><span>VMware Cloud Foundation 元件互動導覽</span></div>
  <div class="ctl">
    <button id="bAuto" aria-pressed="false">▶ 自動播放</button>
    <button id="bTheme">明暗</button>
    <button id="bFull">全螢幕</button>
  </div>
</header>

<div id="tools"><span>⟲ 拖曳旋轉、滾輪換章，點選任一元件</span><label class="zl">模型<input id="zoom" type="range" min="0.8" max="1.2" step="0.01" value="1" aria-label="模型大小"></label><button id="bReset">↺ 重設視角</button></div>

<aside id="panel" aria-live="polite"></aside>

<nav id="bar" aria-label="章節">
  <button id="bPrev" aria-label="上一章">←</button>
  <div id="ticks"></div>
  <button id="bNext" aria-label="下一章">→</button>
  <div id="curT"></div>
</nav>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ───────────── 內容（依 Broadcom TechDocs VCF 9.1／9.1.1） ───────────── */
const V = (v,tp) => `<span class="ver${tp?' tp':''}">${v}${tp?' TP':''}</span>`;
const COMPS = [
  {id:'esx',q:'ESX',tag:'ESX',zh:'虛擬化主機',en:'ESX Hypervisor',color:'#4A7DC0',scope:'每台主機',grp:'infra',
   brief:'裝在每台實體伺服器上的 hypervisor',
   lede:'VCF 的地基：安裝在每台實體伺服器上的 hypervisor，把 CPU、記憶體、網卡與磁碟切分給一台台虛擬機器（VM）。VCF 9 起產品名稱統一為 <b>ESX</b>。',
   figs:[['範圍','每台實體主機'],['所在','管理網域與工作負載網域'],['9.1.1 版本','9.1.1.0<br><span class="mono" style="font-size:11px;color:var(--ink3)">build 25714478</span>']],
   does:['在一台實體伺服器上同時執行多台 VM，並隔離彼此的資源',
     V('9.1')+'NVMe 記憶體分層強化：熱分頁留在 DRAM、冷分頁移到本機 NVMe，增加可用記憶體，並新增軟體鏡像與節省成本分析',
     V('9.1')+'Live Patching（需 TPM 主機）：修補直接套用到執行中的核心，VM 不必停機、不需維護時段',
     V('9.1')+'vSphere Elastic Provisioning：以網路開機（UEFI、HTTP/S）在裸機上自動安裝與設定 ESX'],
   chips:['Hypervisor','VMkernel','NVMe Memory Tiering','Live Patching','Elastic Provisioning','VMware Tools'],
   analogy:'大樓的地基與樓板：每一戶（VM）都蓋在它上面，彼此用牆隔開。'},
  {id:'vc',q:'vCenter',tag:'vCenter',zh:'叢集管理',en:'vCenter',color:'#2E9A8C',scope:'每個網域',grp:'infra',
   brief:'集中管理主機、叢集與 VM',
   lede:'每個網域的大腦：把多台 ESX 主機集中管理成<b>叢集</b>，提供 vMotion、DRS、HA 等叢集功能。VCF 中<b>每個網域都有自己的 vCenter</b>，它們都以 VM 形式執行在管理網域上（模型中畫在各網域上方，方便辨識）。',
   figs:[['範圍','每個網域一套'],['所在','管理網域（VM）'],['9.1.1 版本','9.1.1.0<br><span class="mono" style="font-size:11px;color:var(--ink3)">build 25712839</span>']],
   does:['建立與管理叢集、資源池、VM 與內容庫（Content Library）',
     'DRS 自動平衡負載、vSphere HA 在主機故障時重啟 VM、vMotion 不停機搬移 VM',
     '以 vSphere Lifecycle Manager 映像統一管理主機版本，並作為 Supervisor 的啟用入口',
     V('9.1')+'可直接在 vCenter 使用 NSX 的 VPC 與 Transit Gateway，並在 vCenter 設定 overlay 服務'],
   chips:['Cluster','DRS','vSphere HA','vMotion','Content Library','vLCM','Storage Policy'],
   analogy:'大樓管理中心：知道每層樓還剩多少空間，哪一層出問題就把住戶搬到別層。'},
  {id:'vsan',q:'vSAN',tag:'vSAN',zh:'軟體定義儲存',en:'vSAN',color:'#6E5BB0',scope:'每個叢集',grp:'infra',
   brief:'把主機本機磁碟彙整成共享儲存',
   lede:'把叢集裡每台 ESX 主機的本機磁碟彙整成一個共享的 vSAN 資料存放區，不需要外接儲存陣列。以<b>儲存原則（SPBM）</b>逐台 VM 決定容錯等級與效能。',
   figs:[['範圍','每個叢集'],['架構','ESA（新）／OSA'],['9.1.1 版本','9.1.1.0（隨 ESX 提供）']],
   does:['把主機本機 NVMe／SSD 彙整成單一共享資料存放區，隨主機擴充線性成長',
     '依儲存原則設定 RAID-1／5／6 與可容忍的故障數，原則可逐台 VM 套用',

const geoCache = new Map(), edgeCache = new Map();
function boxGeo(w,h,d){
  const k = `${w.toFixed(3)},${h.toFixed(3)},${d.toFixed(3)}`;
  if(!geoCache.has(k)) geoCache.set(k,new THREE.BoxGeometry(w,h,d));
  return geoCache.get(k);
}
function edgesOf(geo){
  if(!edgeCache.has(geo)) edgeCache.set(geo,new THREE.EdgesGeometry(geo));
  return edgeCache.get(geo);
}
function addEdges(mesh, op=.42){
  const m = new THREE.LineBasicMaterial({color:0x161616,transparent:true,opacity:op});
  edgeMats.push(m);
  const l = new THREE.LineSegments(edgesOf(mesh.geometry),m);
  mesh.add(l); return l;
}
function makeUnit(root, home, labels=[], parent=world){
  root.position.copy(home);
  const u = {root, home:home.clone(), parts:[], labels, ems:[], vis:{t:1,c:1}, dim:{t:1,c:1}, off:{t:new THREE.Vector3(), c:new THREE.Vector3()}};
  u.casters = [];
  const seen = new Set();
  root.traverse(o=>{
    if(o.material && !seen.has(o.material)){
      seen.add(o.material);
      o.material.transparent = true; u.parts.push({m:o.material, base:o.material.opacity, tr:true});
      if(o.material.emissive) u.ems.push(o.material);
    }
    if(o.isMesh && o.castShadow) u.casters.push(o);
    o.userData.u = u;
  });
  units.push(u); parent.add(root); return u;
}
function bodyMat(id, mix=.72){

}

}

  m.userData.comp = id; addEdges(m,op); g.add(m);

}

const TOK_FRONT = new Set(['vcM','vcW','ops','auto','sup']);

/* ───────────── 狀態 ───────────── */
let cur = -1, hoverC = '', auto = false, autoAcc = 0, zoom = 1;
const flow = {step:0, playing:true, acc:0};
const quiz = {i:0, answered:false, pick:'', right:0, done:0};
const VCF_ONLY = new Set(['nsx','sddc','auto']);
const LIFT = {vsan:0,esx:.2,nsx:.45,vc:.75,sddc:.75,vcfms:.75,sup:.75,ops:1.1,auto:1.1,inst:0};

function modeOf(ch){ return ch.kind==='flow'?'flow':ch.kind==='compare'?'cmp':'stack'; }
function builtAt(s){ const b = new Set(); for(let k=0;k<=s;k++) FLOW[k].on.forEach(x=>b.add(x)); return b; }

function computeTargets(){
  const ch = CH[cur]; const mode = modeOf(ch);
  document.body.dataset.mode = mode;
  requestRender();
  worldS.st = mode==='cmp' ? .6 : 1;
  worldS.xt = mode==='cmp' ? -2.2 : 0;
  const st = FLOW[flow.step], built = builtAt(flow.step);
  const qa = ch.kind==='quiz' && quiz.answered ? QUIZ[quiz.i].a : '';
  for(const u of mainUnits){
    const c = u.comp;
    let vis = 1, dim = 1; const off = new THREE.Vector3();
    if(ch.kind==='cover') off.y = LIFT[c];
    if(ch.kind==='comp'){ dim = c===ch.c?1:.14; if(c===ch.c) off.z = .5; }
    if(qa){ dim = c===qa?1:(c===quiz.pick?.5:.14); if(c===qa) off.z = .5; }
    if(mode==='flow'){ vis = built.has(u.key)?1:0; dim = st.on.includes(u.key)?1:.28; }
    if(mode==='cmp') dim = VCF_ONLY.has(c)?1:.3;
    const hov = hoverC===c && mode!=='flow';
    if(hov && ch.kind!=='comp' && !qa) off.z += .35;
    // hover 回饋：帶一點該元件顏色的自發光
    for(const m of u.ems){ m.emissive.set(hov ? C[c].color : 0x000000); m.emissiveIntensity = hov ? .18 : 0; }
    u.vis.t = vis; u.dim.t = dim; u.off.t.copy(off);
    // 元件章只留該元件的標籤；手機版畫面小，其他章也只留標示中的元件
    const hl = mode==='cmp' ? !VCF_ONLY.has(c)
      : ch.kind==='comp' ? c!==ch.c
      : mqMobile.matches && c!==qa && c!==hoverC;
    if(hl!==!!u.hideLbl){ u.hideLbl = hl; u.dirty = true; }
  }
  domTU.vis.t = mode==='stack' && ch.kind!=='comp' && !qa ? 1 : 0;
  domTU.dim.t = 1;
  vvfU.forEach(u=>u.vis.t = mode==='cmp'?1:0);
  cmpTU.vis.t = mode==='cmp'?1:0;

  // 流程標記
  const tu = U[st.at];
  if(TOK_FRONT.has(tu.key)) tok.tgt.set(tu.home.x, tu.home.y+.15, tu.frontZ+.45);
  else tok.tgt.set(tu.home.x, tu.topY+.45, tu.home.z+.2);
  tokMat.color.set(C[tu.comp].color); tokMat.emissive.set(C[tu.comp].color);
  if(tokTag.el._t!==st.tag){ tokTag.el._t = st.tag; tokTag.el.querySelector('.in').textContent = st.tag; }
}

/* 相機 */
const CAM = {
  cover:{p:[14.5,12.5,23],t:[.5,1.5,0]},
  stack:{p:[14,12,23],t:[.5,1.3,0]},
  flow:{p:[14,12.5,24],t:[.5,1.3,0],mobile:{scale:1.0,shift:-.4}},
  cmp:{p:[2.5,7.5,21],t:[-.3,1.3,0],mobile:{scale:1.2,shift:.8}},
};
function camFor(ch){
  if(ch.kind==='cover') return CAM.cover;
  if(ch.kind==='comp'){
    // 目標往元件偏一半，其他元件仍留在畫面內
    const us = mainUnits.filter(u=>u.comp===ch.c);
    const c = us.reduce((a,u)=>a.add(u.home),new THREE.Vector3()).divideScalar(us.length);
    const t = [c.x*.3+.5, Math.max(1.0,c.y*.5+.6), c.z*.5];
    return {p:[t[0]+11,t[1]+8.8,t[2]+18],t};
  }
  if(ch.kind==='flow') return CAM.flow;
  if(ch.kind==='compare') return CAM.cmp;
  return CAM.stack;
}
const zf = z => Math.pow(z,.75);
let fly = null;
function flyTo(c, instant){
  const p = new THREE.Vector3(...c.p), t = new THREE.Vector3(...c.t);
  // 手機版沒有左側面板，場景又寬，所以拉遠相機、只稍微平移
  if(mqMobile.matches){
    const m = c.mobile || {scale:1.0, shift:.3};
    p.sub(t).multiplyScalar(m.scale).add(t);
    p.x += m.shift; t.x += m.shift;
  }
  // 縮放橫軸：模型越大相機越近（取 0.75 次方，放到最大時寬場景的右側標籤才不會出界）
  p.sub(t).divideScalar(zf(zoom)).add(t);
  if(instant||reduced){ camera.position.copy(p); controls.target.copy(t); fly=null; return; }
  fly = {p0:camera.position.clone(), t0:controls.target.clone(), p1:p, t1:t, k:0};
}
controls.addEventListener('start',()=>{ fly = null; });
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;

/* ───────────── 章節切換 ───────────── */
const curT = document.getElementById('curT');
let progY = -1;
function go(i, instant){
  i = Math.max(0,Math.min(CH.length-1,i));
  panel.scrollTop = sections[i].offsetTop;
  progY = panel.scrollTop;
  activate(i, instant);
  setAnchor();
}
function activate(i, instant){
  if(i===cur) return;
  cur = i;
  sections.forEach((s,j)=>s.classList.toggle('on',j===i));
  tickBtns.forEach((b,j)=>b.classList.toggle('on',j===i));
  tickBtns[i].scrollIntoView({block:'nearest',inline:'center'});
  curT.textContent = `${pad(i)}　${CH[i].t}`;
  history.replaceState(null,'','#'+i);
  const ch = CH[i];
  if(ch.kind==='flow'){ flow.step=0; flow.playing=!reduced; flow.acc=0; renderFlow(); tok.pos.copy(tok.tgt); }
  controls.autoRotate = ch.kind==='cover' && !reduced;
  hoverC = '';
  flyTo(camFor(ch), instant);
  computeTargets();
  if(ch.kind==='flow') tok.pos.copy(tok.tgt);
  autoAcc = 0;
}
ticks.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(+b.dataset.go); });
document.getElementById('bPrev').onclick = ()=>go(cur-1);
document.getElementById('bNext').onclick = ()=>go(cur+1);
document.getElementById('bReset').onclick = ()=>flyTo(camFor(CH[cur]));

// 點到還沒捲到判斷線的章節（例如頁尾的測驗），先切到那一章，按鈕才有作用
panel.addEventListener('pointerdown',e=>{
  const s = e.target.closest('.pg');
  if(s && +s.dataset.i!==cur){ activate(+s.dataset.i); setAnchor(); }
});
// 總覽列：滑過連動模型、點選跳章
panel.addEventListener('click',e=>{
  const r = e.target.closest('.row'); if(r) go(chOfComp(r.dataset.comp));
});
panel.addEventListener('pointerover',e=>{
  const r = e.target.closest('.row');
  const c = r ? r.dataset.comp : '';
  if(c!==hoverC && CH[cur].kind==='overview'){ hoverC = c; computeTargets(); }
});

/* 流程控制 */
const $ = id => document.getElementById(id);
function renderFlow(){
  const st = FLOW[flow.step];
  $('fPh').textContent = st.ph;
  $('fSn').textContent = `步驟 ${flow.step+1} / ${FLOW.length}`;
  $('fT').textContent = st.t;
  $('fNote').innerHTML = st.note;
  const comps = [...new Set(st.on.map(k=>U[k].comp))];
  $('fWho').innerHTML = comps.map(c=>`<span class="dot" style="--c:${C[c].color}">${C[c].tag}</span>`).join('');
  $('fScrub').value = flow.step;
  $('fPlay').textContent = flow.playing?'Ⅱ 暫停':'▶ 播放';
  if(CH[cur]?.kind==='flow') computeTargets();
}
function flowGo(s){ flow.step = Math.max(0,Math.min(FLOW.length-1,s)); flow.acc = 0; renderFlow(); }
$('fBack').onclick = ()=>{ flow.playing=false; flowGo(flow.step-1); };
$('fFwd').onclick = ()=>{ flow.playing=false; flowGo(flow.step+1); };
$('fPlay').onclick = ()=>{ if(flow.step===FLOW.length-1) flow.step=0; flow.playing=!flow.playing; flow.acc=0; renderFlow(); };
$('fRe').onclick = ()=>{ flow.playing=true; flowGo(0); };
$('fScrub').oninput = e=>{ flow.playing=false; flowGo(+e.target.value); };

/* 測驗 */
function renderQuiz(){
  const q = QUIZ[quiz.i];
  $('qN').textContent = `情境 ${quiz.i+1} / ${QUIZ.length}`;
  $('qT').textContent = q.q;
  $('qB').querySelectorAll('button').forEach(b=>{ b.disabled=false; b.className=''; });
  $('qF').innerHTML = '';
  $('qS').textContent = quiz.done ? `答對 ${quiz.right} / ${quiz.done}` : '';
  $('qNext').style.visibility = 'hidden';
}
function answer(id){
  if(quiz.answered || CH[cur].kind!=='quiz' || !C[id]) return;
  const q = QUIZ[quiz.i];
  quiz.answered = true; quiz.pick = id; quiz.done++;
  const ok = id===q.a; if(ok) quiz.right++;
  $('qB').querySelectorAll('button').forEach(b=>{
    const v = b.dataset.ans; b.disabled = true;
    if(v===q.a) b.className='right'; else if(v===id) b.className='wrong';
  });
  const d = C[q.a];
  $('qF').innerHTML = ok
    ? `<span class="res ok">答對了｜${d.tag}</span><br>${q.why}`
    : `<span class="res no">不是 ${C[id].tag}</span>，正確答案是 <b>${d.tag}</b>。<br>${q.why}`;
  $('qS').textContent = `答對 ${quiz.right} / ${quiz.done}`;
  $('qNext').style.visibility = 'visible';
  $('qNext').textContent = quiz.i===QUIZ.length-1 ? '從頭再來 ↻' : '下一題 →';
  computeTargets();
}
$('qB').addEventListener('click',e=>{ const b=e.target.closest('[data-ans]'); if(b) answer(b.dataset.ans); });
$('qNext').onclick = ()=>{
  if(quiz.i===QUIZ.length-1){ quiz.i=0; quiz.right=0; quiz.done=0; } else quiz.i++;
  quiz.answered=false; quiz.pick=''; renderQuiz(); computeTargets();
};

/* 拾取：滑過與點選模型 */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
function pickC(e){
  if(modeOf(CH[cur])==='flow') return '';
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hit = ray.intersectObjects(pickables,false).find(h=>h.object.userData.u.vis.c>.5);
  return hit ? hit.object.userData.comp : '';
}
// pointermove 只記下位置，射線檢測在主迴圈裡每幀最多做一次
let pendingHover = null;
renderer.domElement.addEventListener('pointermove',e=>{ if(!e.buttons) pendingHover = e; });
function processHover(){
  if(!pendingHover) return;
  const c = pickC(pendingHover); pendingHover = null;
  renderer.domElement.style.cursor = c?'pointer':'grab';
  if(c!==hoverC){ hoverC = c;
    panel.querySelectorAll('.row').forEach(r=>r.classList.toggle('hl',r.dataset.comp===c));
    computeTargets(); }
}
renderer.domElement.addEventListener('pointerleave',()=>{ pendingHover = null; if(hoverC){ hoverC=''; panel.querySelectorAll('.row.hl').forEach(r=>r.classList.remove('hl')); computeTargets(); }});
renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downAt || Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5) return;
  const c = pickC(e); if(!c) return;
  if(CH[cur].kind==='quiz') answer(c); else go(chOfComp(c));
});

/* 頂部控制 */
const bAuto = $('bAuto');
bAuto.onclick = ()=>{ auto=!auto; autoAcc=0; bAuto.setAttribute('aria-pressed',auto); bAuto.textContent = auto?'Ⅱ 自動播放':'▶ 自動播放'; };
function themeNow(){ return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); }
function applyTheme(){
  const dark = themeNow()==='dark';
  const ink = new THREE.Color(dark?'#ECECE8':'#161616');
  edgeMats.forEach(m=>m.color.copy(ink));
  const base = new THREE.Color(dark?'#2A2C2F':'#FFFFFF');
  bodyMats.forEach(b=>b.m.color.copy(b.color).lerp(base, dark? Math.min(.62,b.mix*.85) : b.mix));
  groundMat.opacity = dark?.38:.16;
  hemi.groundColor.set(dark?'#3a3b3d':'#c9cac6');
  requestRender();
}
$('bTheme').onclick = ()=>{ document.documentElement.dataset.theme = themeNow()==='dark'?'light':'dark'; applyTheme(); };
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
function toggleFull(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
$('bFull').onclick = toggleFull;

addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')) return;
  const k = e.key;
  if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button,a'))){ e.preventDefault(); go(cur+1); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(k==='f'||k==='F') toggleFull();
  else if(k==='Home') go(0);
  else if(k==='End') go(CH.length-1);
  else if(CH[cur].kind==='quiz' && /^[0-9]$/.test(k)){ const c = COMPS.find(x=>keyOf(C[x.id])===k); if(c) answer(c.id); }
});

/* 尺寸 */
function sizeStage(){
  const r = stage.getBoundingClientRect();
  const w = Math.max(1,r.width), h = Math.max(1,r.height);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(w,h); labelR.setSize(w,h);
  camera.aspect = w/h;
  if(!mqMobile.matches){
    const pr = panel.getBoundingClientRect().right;
    camera.setViewOffset(w,h,-pr/2,0,w,h);
    // 模型置中在面板右側的空間；1000 約是 1440 寬、內容區 440px 時的可用寬度，再留一點標籤邊距
    camera.zoom = Math.min(1,(w-pr)/1000);
  } else { camera.clearViewOffset(); camera.zoom = 1; }
  camera.updateProjectionMatrix();
  requestRender();
}
// 版面變動後，依捲動比例把面板還原到同一處
// 捲動判斷章節：面板 0.45 倍高度那條線落在哪一章
const LINE = .45;
let anchor = {i:0,f:0};
function setAnchor(){ const s = sections[cur]; anchor = {i:cur, f:(panel.scrollTop-s.offsetTop)/s.offsetHeight}; }
panel.addEventListener('scroll',()=>{
  if(Math.abs(panel.scrollTop-progY)<2) return;   // go() 自己捲的，章節已設定
  progY = -1;
  const y = panel.scrollTop + LINE*panel.clientHeight;
  let i = 0; while(i<sections.length-1 && sections[i+1].offsetTop<=y) i++;
  activate(i);
  setAnchor();
},{passive:true});
// 版面變寬變窄後，依 anchor 捲回同一章同一處，並讓判斷線仍落在同一章
function keepScroll(fn){
  const a = anchor;
  fn();
  const s = sections[a.i], L = LINE*panel.clientHeight;
  const y = s.offsetTop + a.f*s.offsetHeight;
  panel.scrollTop = Math.min(Math.max(y, s.offsetTop-L), s.offsetTop+s.offsetHeight-L-1);
  progY = panel.scrollTop; anchor = a;
}
addEventListener('resize',()=>keepScroll(sizeStage));
addEventListener('hashchange',()=>{ const n = parseInt(location.hash.slice(1)); if(Number.isFinite(n)) go(n); });
mqMobile.addEventListener('change',()=>{ sizeStage(); flyTo(camFor(CH[cur]),true); computeTargets(); });
// 拖曳結束就移開焦點，← → 才會回到換章；鍵盤操作橫軸不受影響
$('zoom').addEventListener('pointerup',e=>e.target.blur());
$('zoom').addEventListener('input',e=>{
  const z = +e.target.value, old = zoom; zoom = z;
  keepScroll(()=>{ document.documentElement.style.setProperty('--z',z); sizeStage(); });
  // 最後依新的縮放倍率調整相機距離（飛行中也一併調整終點）
  const r = zf(old)/zf(z);
  camera.position.sub(controls.target).multiplyScalar(r).add(controls.target);
  if(fly) fly.p1.sub(fly.t1).multiplyScalar(r).add(fly.t1);
  controls.update(); requestRender();
});

/* ───────────── 主迴圈 ───────────── */
// 按需重繪：畫面靜止時跳過 WebGL 與標籤的繪製，狀態邏輯（自動播放、流程步進）照常每幀執行
let wake = 2;
function requestRender(){ wake = Math.max(wake,2); }
controls.addEventListener('change',requestRender);
const EPS = 1e-3;
function setLabel(el, o, vis){
  if(el._o!==o){ el._o = o; el.style.opacity = o; }
  if(el._v!==vis){ el._v = vis; el.style.visibility = vis; }
}
const clock = new THREE.Clock();
const progress = $('progress');
function tick(){
  const dt = Math.min(clock.getDelta(),.25), t = clock.elapsedTime;
  const k = reduced ? 1 : 1-Math.exp(-dt*6);

  if(fly){
    fly.k = Math.min(1, fly.k + dt/1.3);
    const e = ease(fly.k);
    camera.position.lerpVectors(fly.p0,fly.p1,e);
    controls.target.lerpVectors(fly.t0,fly.t1,e);
    if(fly.k>=1) fly = null;
  }
  processHover();
  let active = !!fly;
  if(controls.update()) active = true;
  if(controls.autoRotate) active = true;

  // world 縮放與平移（對照章）
  if(Math.abs(worldS.s-worldS.st)>EPS || Math.abs(worldS.x-worldS.xt)>EPS){
    worldS.s += (worldS.st-worldS.s)*k; worldS.x += (worldS.xt-worldS.x)*k;
    if(Math.abs(worldS.s-worldS.st)<=EPS && Math.abs(worldS.x-worldS.xt)<=EPS){ worldS.s = worldS.st; worldS.x = worldS.xt; }
    world.scale.setScalar(worldS.s); world.position.x = worldS.x;
    active = true;
  }

  for(const u of units){
    const moving = Math.abs(u.vis.t-u.vis.c)>EPS || Math.abs(u.dim.t-u.dim.c)>EPS || u.off.c.distanceToSquared(u.off.t)>EPS*EPS;
    if(!moving && !u.dirty) continue;
    if(moving){
      u.vis.c += (u.vis.t-u.vis.c)*k;
      u.dim.c += (u.dim.t-u.dim.c)*k;
      u.off.c.lerp(u.off.t,k);
      active = true; u.dirty = true;
    } else { u.vis.c = u.vis.t; u.dim.c = u.dim.t; u.off.c.copy(u.off.t); u.dirty = false; }
    u.root.position.copy(u.home).add(u.off.c);
    const a = u.vis.c*u.dim.c;
    u.root.visible = u.vis.c>.01;
    for(const p of u.parts){
      p.m.opacity = p.base*a; p.m.depthWrite = a>.6;
      // 完全不透明時改走不透明渲染流程，深度排序才正確
      const tr = p.base*a < .999;
      if(tr!==p.tr){ p.tr = tr; p.m.transparent = tr; p.m.needsUpdate = true; }
    }
    // 變淡的 unit 不投影，否則地面陰影會透過半透明物件形成一大塊灰
    const cast = a>.6;
    if(cast!==u.cast){ u.cast = cast; for(const m of u.casters) m.castShadow = cast; }
    for(const el of u.labels) setLabel(el, +(u.vis.c*(.3+.7*u.dim.c)).toFixed(3), u.vis.c<.03||u.hideLbl?'hidden':'visible');
  }

  // 流程標記
  const flowOn = CH[cur]?.kind==='flow';
  token.visible = flowOn;
  setLabel(tokTag.el, 1, flowOn?'visible':'hidden');
  if(flowOn){
    active = true;
    tok.pos.lerp(tok.tgt, reduced?1:1-Math.exp(-dt*4));
    token.position.copy(tok.pos);
    token.position.y += Math.sin(t*2.2)*.05;
    tokMesh.rotation.y = t*1.2;
  }

  // 流程自動前進
  if(flowOn && flow.playing){
    flow.acc += dt;
    if(flow.acc>2.6){
      if(flow.step<FLOW.length-1) flowGo(flow.step+1);
      else { flow.playing=false; renderFlow(); }
    }
  }

  // 自動播放章節
  if(auto){
    const ch = CH[cur];
    const busy = ch.kind==='flow' && flow.playing;
    if(!busy) autoAcc += dt;
    const need = ch.kind==='flow'?2.5:8;
    progress.style.width = (busy?0:Math.min(1,autoAcc/need)*100)+'%';
    if(autoAcc>need){
      if(cur>=CH.length-2){ go(cur+1); bAuto.click(); progress.style.width='0'; }
      else go(cur+1);
    }
  } else progress.style.width = '0';

  if(active || wake>0){
    renderer.render(scene,camera);
    labelR.render(scene,camera);
    if(wake>0) wake--;
  }
  requestAnimationFrame(tick);
}

/* 啟動 */
applyTheme();
sizeStage();
const start = parseInt(location.hash.slice(1));
renderQuiz();
go(Number.isFinite(start)?start:0, true);
units.forEach(u=>{ u.vis.c=u.vis.t; u.dim.c=u.dim.t; u.off.c.copy(u.off.t); u.dirty=true; });
world.scale.setScalar(worldS.s = worldS.st); world.position.x = worldS.x = worldS.xt;
tok.pos.copy(tok.tgt);
tick();
</script>
</body>
</html>
